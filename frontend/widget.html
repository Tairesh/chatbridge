<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f2f5; }
    #chat-container { width: 480px; max-height: 90vh; background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    #header { padding: 16px; background: #2563eb; color: #fff; font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    #status { font-size: 12px; font-weight: 400; opacity: 0.85; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 400px; }
    .message { padding: 8px 12px; border-radius: 8px; max-width: 80%; word-wrap: break-word; font-size: 14px; line-height: 1.4; position: relative; }
    .message.sent { background: #2563eb; color: #fff; align-self: flex-end; }
    .message.received { background: #e5e7eb; color: #1f2937; align-self: flex-start; }
    .message.system { background: transparent; color: #9ca3af; align-self: center; font-size: 12px; font-style: italic; }
    .message.archived { opacity: 0.6; }
    .msg-text { display: inline; }
    .msg-meta { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 4px; font-size: 11px; opacity: 0.7; }
    .msg-time { font-size: 11px; }
    .msg-edited { font-size: 10px; font-style: italic; }
    .msg-status { display: inline-flex; align-items: center; font-size: 12px; }
    .spinner { width: 12px; height: 12px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .checkmark { color: rgba(255,255,255,0.6); font-size: 13px; }
    #input-area { display: flex; padding: 12px; border-top: 1px solid #e5e7eb; gap: 8px; }
    #msg-input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
    #msg-input:focus { border-color: #2563eb; }
    #send-btn { padding: 10px 20px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    #send-btn:hover { background: #1d4ed8; }
    #send-btn:disabled { background: #93c5fd; cursor: not-allowed; }
    .edit-input { width: 100%; padding: 4px 8px; border: 1px solid rgba(255,255,255,0.5); border-radius: 4px; background: rgba(255,255,255,0.15); color: #fff; font-size: 14px; font-family: inherit; outline: none; }
    .edit-hint { font-size: 10px; opacity: 0.6; margin-top: 2px; }
  </style>
</head>
<body>
  <div id="chat-container">
    <div id="header">
      Chat
      <span id="status">Connecting...</span>
    </div>
    <div id="messages"></div>
    <div id="input-area">
      <input type="text" id="msg-input" placeholder="Type a message..." disabled>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('msg-input');
    const sendBtn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');

    const WIDGET_ID = 'test-widget';
    const TOKEN_KEY = 'chatbridge_token';
    const BASE_URL = location.origin;

    // Track sent messages: mid -> { text, element, acknowledged }
    const sentMessages = new Map();
    // Row id of every bubble in the DOM — history dedup key.
    const renderedIds = new Set();
    let ws;
    let editingMid = null;
    let chatState = null;      // { id, status } of this client's most recent chat
    let historyLoaded = false; // first load prepends, later loads append

    function connect() {
      let url = `ws://localhost/ws/${WIDGET_ID}`;
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) {
        url += `?token=${encodeURIComponent(token)}`;
      }
      ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        statusEl.textContent = 'Connected';
        input.disabled = false;
        sendBtn.disabled = false;
        addSystemMessage('Connected to server');
      });

      ws.addEventListener('message', (event) => {
        const msg = JSON.parse(event.data);
        // Handle action-based messages (auth, ack, error)
        if (msg.action) {
          switch (msg.action) {
            case 'auth':
              if (msg.token) localStorage.setItem(TOKEN_KEY, msg.token);
              break;
            case 'ack':
              handleAck(msg.message_id, msg.id);
              break;
            case 'chat':
              chatState = { id: msg.chat_id, status: msg.status };
              loadHistory();
              break;
            case 'error':
              addSystemMessage('Error: ' + msg.reason);
              break;
          }
          return;
        }
        // Handle type-based events (from operator via shared listener)
        if (msg.type === 'message') {
          appendInboundMessage(msg);
          // Auto read receipt
          if (msg.id) {
            ws.send(JSON.stringify({ action: 'read', mid: msg.id }));
          }
          return;
        }
        if (msg.type === 'edit') {
          updateInboundEdit(msg);
          return;
        }
        if (msg.type === 'read') {
          updateReadStatus(msg);
          return;
        }
      });

      ws.addEventListener('close', () => {
        statusEl.textContent = 'Disconnected';
        input.disabled = true;
        sendBtn.disabled = true;
        addSystemMessage('Disconnected. Reconnecting...');
        setTimeout(connect, 3000);
      });

      ws.addEventListener('error', () => {
        statusEl.textContent = 'Error';
      });
    }

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'message system';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addSentMessage(mid, text) {
      const div = document.createElement('div');
      div.className = 'message sent';
      div.id = 'msg-' + mid;
      // No id from the server yet — the ack brings the row id, and that is what every
      // later event names. The external id is never reconstructed here: it contains
      // the client id, which the browser does not know.
      div.dataset.messageId = '';
      div.innerHTML = `
        <span class="msg-text">${escapeHtml(text)}</span>
        <div class="msg-meta">
          <span class="msg-edited" style="display:none">edited</span>
          <span class="msg-time">${formatTime(new Date())}</span>
          <span class="msg-status"><span class="spinner"></span></span>
        </div>
      `;
      div.addEventListener('dblclick', () => startEdit(mid));
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      sentMessages.set(mid, { text, element: div, acknowledged: false });
    }

    function handleAck(messageId, id) {
      const entry = sentMessages.get(messageId);
      if (!entry) return;

      if (id) {
        entry.element.dataset.messageId = id;
        renderedIds.add(id);
      }
      entry.acknowledged = true;
      const statusSpan = entry.element.querySelector('.msg-status');
      if (statusSpan) {
        statusSpan.innerHTML = '<span class="checkmark">✓</span>';
      }

      // If this was an edit ACK, show "edited" label
      if (entry.edited) {
        const editedSpan = entry.element.querySelector('.msg-edited');
        if (editedSpan) editedSpan.style.display = '';
      }
    }

    function startEdit(mid) {
      const entry = sentMessages.get(mid);
      if (!entry || !entry.acknowledged || editingMid) return;
      if (entry.element.classList.contains('archived')) return;

      editingMid = mid;
      const textSpan = entry.element.querySelector('.msg-text');
      const originalText = entry.text;

      textSpan.innerHTML = `
        <input class="edit-input" type="text" value="${escapeAttr(originalText)}">
        <div class="edit-hint">Enter to save · Escape to cancel</div>
      `;

      const editInput = textSpan.querySelector('.edit-input');
      editInput.focus();
      editInput.setSelectionRange(editInput.value.length, editInput.value.length);

      editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const newText = editInput.value.trim();
          if (newText && newText !== originalText) {
            submitEdit(mid, newText);
          } else {
            cancelEdit(mid, originalText);
          }
        } else if (e.key === 'Escape') {
          cancelEdit(mid, originalText);
        }
      });

      editInput.addEventListener('blur', () => {
        // Small delay to allow Enter handler to fire first
        setTimeout(() => {
          if (editingMid === mid) {
            cancelEdit(mid, originalText);
          }
        }, 150);
      });
    }

    function submitEdit(mid, newText) {
      const entry = sentMessages.get(mid);
      if (!entry) return;

      entry.text = newText;
      entry.edited = true;
      editingMid = null;

      const textSpan = entry.element.querySelector('.msg-text');
      textSpan.textContent = newText;

      // Show spinner while waiting for ACK
      const statusSpan = entry.element.querySelector('.msg-status');
      statusSpan.innerHTML = '<span class="spinner"></span>';
      entry.acknowledged = false;

      ws.send(JSON.stringify({ action: 'edit', mid: mid, text: newText }));
    }

    function cancelEdit(mid, originalText) {
      const entry = sentMessages.get(mid);
      if (!entry) return;

      editingMid = null;
      const textSpan = entry.element.querySelector('.msg-text');
      textSpan.textContent = originalText;
    }

    function appendInboundMessage(event) {
      const div = document.createElement('div');
      div.className = 'message received';
      div.dataset.messageId = event.id;
      renderedIds.add(event.id);
      const senderName = event.sender && event.sender.name ? event.sender.name : 'Operator';
      div.innerHTML = `
        <div style="font-size:11px;font-weight:600;color:#6b7280;margin-bottom:2px">${escapeHtml(senderName)}</div>
        <span class="msg-text">${escapeHtml(event.text || '')}</span>
        <div class="msg-meta">
          <span class="msg-edited" style="display:none">edited</span>
          <span class="msg-time">${formatTime(new Date(event.created_at || Date.now()))}</span>
        </div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function loadHistory() {
      if (!chatState) return;

      let messages;
      try {
        const resp = await fetch(`${BASE_URL}/api/chats/${chatState.id}`);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        messages = await resp.json();
      } catch (e) {
        console.error('Failed to load history:', e);
        addSystemMessage('Failed to load history');
        return;
      }

      const archived = chatState.status !== 'new';
      const frag = document.createDocumentFragment();
      let newestUnread = null;

      for (const msg of messages) {
        if (msg.sender_type !== 'client' && msg.status !== 'read') {
          newestUnread = msg;
        }
        if (renderedIds.has(msg.id)) continue;
        renderedIds.add(msg.id);
        frag.appendChild(msg.sender_type === 'client'
          ? buildHistorySent(msg, archived)
          : buildHistoryReceived(msg, archived));
      }

      if (historyLoaded) {
        // Reconnect: whatever arrived while we were offline belongs at the bottom.
        messagesEl.appendChild(frag);
      } else {
        // First load: history belongs above the "Connected to server" line, or old
        // messages read as if they had just arrived.
        messagesEl.prepend(frag);
        historyLoaded = true;
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;

      // One read receipt clears the whole prefix — mark_messages_read_by_id marks
      // every message in the chat with created_at <= the target. Archived chats get
      // none: back-dating reads in a closed conversation is meaningless.
      if (!archived && newestUnread && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ action: 'read', mid: newestUnread.id }));
      }
    }

    function buildHistorySent(msg, archived) {
      // `widget:<client_id>:<mid>` — `startEdit` needs the trailing mid, because the
      // edit goes back out under it and the server rebuilds the same external id.
      const mid = msg.external_message_id.startsWith('widget:')
        ? msg.external_message_id.split(':').pop()
        : msg.id;
      const div = document.createElement('div');
      div.className = 'message sent' + (archived ? ' archived' : '');
      div.id = 'msg-' + mid;
      div.dataset.messageId = msg.id;
      const check = msg.status === 'read'
        ? '<span class="checkmark" style="color:rgba(255,255,255,0.8)">✓✓</span>'
        : '<span class="checkmark">✓</span>';
      div.innerHTML = `
        <span class="msg-text">${escapeHtml(msg.text || '')}</span>
        <div class="msg-meta">
          <span class="msg-edited"${msg.edited_at ? '' : ' style="display:none"'}>edited</span>
          <span class="msg-time">${formatTime(new Date(msg.created_at))}</span>
          <span class="msg-status">${check}</span>
        </div>
      `;
      div.addEventListener('dblclick', () => startEdit(mid));
      // Registering the entry is what makes double-click editing and incoming
      // read/edit events work on a bubble that came from history.
      sentMessages.set(mid, {
        text: msg.text || '',
        element: div,
        acknowledged: true,
        edited: !!msg.edited_at,
      });
      return div;
    }

    function buildHistoryReceived(msg, archived) {
      const div = document.createElement('div');
      div.className = 'message received' + (archived ? ' archived' : '');
      div.dataset.messageId = msg.id;
      const senderName = msg.sender_name || 'Operator';
      div.innerHTML = `
        <div style="font-size:11px;font-weight:600;color:#6b7280;margin-bottom:2px">${escapeHtml(senderName)}</div>
        <span class="msg-text">${escapeHtml(msg.text || '')}</span>
        <div class="msg-meta">
          <span class="msg-edited"${msg.edited_at ? '' : ' style="display:none"'}>edited</span>
          <span class="msg-time">${formatTime(new Date(msg.created_at))}</span>
        </div>
      `;
      return div;
    }

    function updateInboundEdit(event) {
      // The row id, not the external one: the external id belongs to the server, and
      // a provider replaces it the moment it accepts the message.
      const el = messagesEl.querySelector(`[data-message-id="${event.id}"]`);
      if (!el) return;
      const textEl = el.querySelector('.msg-text');
      if (textEl) textEl.textContent = event.text || '';
      const editedSpan = el.querySelector('.msg-edited');
      if (editedSpan) editedSpan.style.display = '';
    }

    function updateReadStatus(event) {
      const el = messagesEl.querySelector(`[data-message-id="${event.id}"]`);
      if (!el) return;
      const statusSpan = el.querySelector('.msg-status');
      if (statusSpan) statusSpan.innerHTML = '<span class="checkmark" style="color:rgba(255,255,255,0.8)">✓✓</span>';
    }

    function send() {
      const text = input.value.trim();
      if (!text || ws.readyState !== WebSocket.OPEN) return;

      const mid = crypto.randomUUID();
      addSentMessage(mid, text);
      ws.send(JSON.stringify({ action: 'send', mid: mid, text: text, attachments: [] }));
      input.value = '';
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function escapeAttr(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });

    connect();
  </script>
</body>
</html>
