<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operator Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; display: flex; height: 100vh; background: #f0f2f5; }

    #sidebar { width: 360px; background: #fff; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; }
    #sidebar-header { padding: 16px; background: #1e293b; color: #fff; font-weight: 600; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
    #ws-status { font-size: 12px; font-weight: 400; opacity: 0.85; }
    #chat-list { flex: 1; overflow-y: auto; }
    .chat-item { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; transition: background 0.15s; }
    .chat-item:hover { background: #f9fafb; }
    .chat-item.active { background: #eff6ff; border-left: 3px solid #2563eb; }
    .chat-client { font-weight: 600; font-size: 14px; color: #1f2937; display: flex; align-items: center; gap: 6px; }
    .chat-preview { font-size: 13px; color: #6b7280; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-time { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .provider-badge { font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; text-transform: uppercase; }
    .provider-widget { background: #dbeafe; color: #1d4ed8; }
    .provider-instagram { background: #fce7f3; color: #be185d; }
    .provider-telegram { background: #d1fae5; color: #047857; }

    #main { flex: 1; display: flex; flex-direction: column; }
    #main-header { padding: 16px; background: #fff; border-bottom: 1px solid #e5e7eb; font-weight: 600; font-size: 16px; color: #374151; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 8px; max-width: 70%; font-size: 14px; line-height: 1.4; }
    .msg.inbound { background: #e5e7eb; color: #1f2937; align-self: flex-start; }
    .msg.outbound { background: #2563eb; color: #fff; align-self: flex-end; }
    .msg-sender { font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 2px; }
    .msg-info { font-size: 11px; color: #9ca3af; margin-top: 4px; display: flex; gap: 8px; }
    .msg.outbound .msg-info { color: rgba(255,255,255,0.7); }
    .msg-edited-label { font-size: 10px; font-style: italic; }
    .msg-read-label { font-size: 12px; color: rgba(255,255,255,0.8); }

    #empty-state { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 16px; }

    #compose { padding: 12px 16px; background: #fff; border-top: 1px solid #e5e7eb; display: none; gap: 8px; }
    #compose-input { flex: 1; padding: 8px 12px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; outline: none; }
    #compose-input:focus { border-color: #2563eb; }
    #compose-send { padding: 8px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #compose-send:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div id="sidebar-header">
      Chats
      <span id="ws-status">Connecting...</span>
    </div>
    <div id="chat-list"></div>
  </div>
  <div id="main">
    <div id="main-header">Select a chat</div>
    <div id="empty-state">Select a chat from the sidebar to view messages</div>
    <div id="messages" style="display:none"></div>
    <div id="compose">
      <input type="text" id="compose-input" placeholder="Type a message..." />
      <button id="compose-send">Send</button>
    </div>
  </div>

  <script>
    const BASE_URL = location.origin;
    const WS_BASE = location.origin.replace(/^http/, 'ws');

    const chatListEl = document.getElementById('chat-list');
    const mainHeader = document.getElementById('main-header');
    const messagesEl = document.getElementById('messages');
    const emptyState = document.getElementById('empty-state');
    const wsStatus = document.getElementById('ws-status');

    let ws;
    let selectedChatId = null;
    let chatsData = [];
    let refreshTimer = null;
    let operatorId = localStorage.getItem('operator_id');
    let operatorToken = localStorage.getItem('operator_token');

    // ── WebSocket ────────────────────────────────────────────────

    function connectWs() {
      const url = operatorToken
        ? `${WS_BASE}/ws/operator?token=${encodeURIComponent(operatorToken)}`
        : `${WS_BASE}/ws/operator`;
      ws = new WebSocket(url);

      ws.addEventListener('open', () => {
        wsStatus.textContent = 'Live';
      });

      ws.addEventListener('message', (event) => {
        const data = JSON.parse(event.data);
        if (data.action === 'auth') {
          if (data.token) {
            operatorToken = data.token;
            localStorage.setItem('operator_token', data.token);
          }
          if (data.operator_id) {
            operatorId = data.operator_id;
            localStorage.setItem('operator_id', data.operator_id);
          }
          return;
        }
        if (data.action === 'ack') {
          return;
        }
        if (data.action === 'error') {
          console.error('Server error:', data.reason);
          return;
        }
        handleEvent(data);
      });

      ws.addEventListener('close', () => {
        wsStatus.textContent = 'Disconnected';
        setTimeout(connectWs, 3000);
      });

      ws.addEventListener('error', () => {
        wsStatus.textContent = 'Error';
      });
    }

    function handleEvent(event) {
      // Debounced refresh of chat list
      if (!refreshTimer) {
        refreshTimer = setTimeout(() => {
          refreshTimer = null;
          loadChats();
        }, 1000);
      }

      if (event.type === 'message') {
        if (event.sender && event.sender.id === operatorId) return; // already rendered optimistically
        if (event.chat_id === selectedChatId) {
          appendMessage(event);
        }
      } else if (event.type === 'edit' && selectedChatId) {
        updateEditedMessage(event);
      } else if (event.type === 'read' && selectedChatId) {
        updateReadMessage(event);
      }
    }

    // ── Chat list ────────────────────────────────────────────────

    async function loadChats() {
      try {
        const resp = await fetch(`${BASE_URL}/api/chats`);
        chatsData = await resp.json();
        renderChatList();
      } catch (e) {
        console.error('Failed to load chats:', e);
      }
    }

    function renderChatList() {
      chatListEl.innerHTML = '';
      for (const chat of chatsData) {
        const div = document.createElement('div');
        div.className = 'chat-item' + (chat.chat_id === selectedChatId ? ' active' : '');
        div.dataset.chatId = chat.chat_id;

        const name = chat.client_name || 'Anonymous';
        const provider = chat.client_provider || 'unknown';
        const badgeClass = 'provider-' + provider;

        let preview = chat.last_message_text ? truncate(chat.last_message_text, 50) : 'No messages yet';
        if (chat.last_message_sender_type === 'operator' && chat.last_message_sender_name) {
          preview = escapeHtml(chat.last_message_sender_name) + ': ' + escapeHtml(preview);
        } else if (chat.last_message_sender_type === 'operator') {
          preview = 'You: ' + escapeHtml(preview);
        } else {
          preview = escapeHtml(preview);
        }

        const time = chat.last_message_at ? formatTime(chat.last_message_at) : formatTime(chat.chat_created_at);

        div.innerHTML = `
          <div class="chat-client">
            ${escapeHtml(name)}
            <span class="provider-badge ${badgeClass}">${escapeHtml(provider)}</span>
          </div>
          <div class="chat-preview">${preview}</div>
          <div class="chat-time">${time}</div>
        `;
        div.addEventListener('click', () => selectChat(chat));
        chatListEl.appendChild(div);
      }
    }

    // ── Chat detail ──────────────────────────────────────────────

    async function selectChat(chat) {
      selectedChatId = chat.chat_id;
      const name = chat.client_name || 'Anonymous';
      const provider = chat.client_provider || 'unknown';
      mainHeader.textContent = `${name} (${provider})`;
      emptyState.style.display = 'none';
      messagesEl.style.display = 'flex';
      messagesEl.innerHTML = '';
      document.getElementById('compose').style.display = 'flex';
      renderChatList(); // update active state

      try {
        const resp = await fetch(`${BASE_URL}/api/chats/${chat.chat_id}`);
        const messages = await resp.json();
        for (const msg of messages) {
          appendMessage(msg);
        }
      } catch (e) {
        console.error('Failed to load messages:', e);
      }
    }

    function appendMessage(msg) {
      const div = document.createElement('div');
      const isOperator = (msg.sender && msg.sender.type === 'operator') || msg.sender_type === 'operator';
      div.className = 'msg ' + (isOperator ? 'outbound' : 'inbound');
      div.dataset.messageId = msg.id;
      div.dataset.externalId = msg.external_message_id;

      const text = msg.text || '';
      const time = formatTime(msg.created_at);
      const edited = msg.edited_at ? '<span class="msg-edited-label">edited</span>' : '';
      const read = msg.status === 'read' && isOperator ? '<span class="msg-read-label">✓✓</span>' : '';
      const senderName = (!isOperator && msg.sender && msg.sender.name)
        ? `<div class="msg-sender">${escapeHtml(msg.sender.name)}</div>` : '';

      div.innerHTML = `
        ${senderName}
        <span class="msg-text">${escapeHtml(text)}</span>
        <div class="msg-info">
          <span>${time}</span>
          ${edited}
          ${read}
        </div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      // Auto read receipt for inbound messages
      if (!isOperator && selectedChatId && msg.id && ws && ws.readyState === 1 && msg.status !== 'read') {
        ws.send(JSON.stringify({
          action: 'read',
          chat_id: selectedChatId,
          mid: msg.id
        }));
      }
    }

    function updateEditedMessage(event) {
      const el = messagesEl.querySelector(`[data-external-id="${event.external_message_id}"]`);
      if (!el) return;
      const textSpan = el.querySelector('.msg-text');
      if (textSpan) textSpan.textContent = event.text || '';
      const infoDiv = el.querySelector('.msg-info');
      if (infoDiv && !infoDiv.querySelector('.msg-edited-label')) {
        infoDiv.insertAdjacentHTML('beforeend', '<span class="msg-edited-label">edited</span>');
      }
    }

    function updateReadMessage(event) {
      const el = messagesEl.querySelector(`[data-external-id="${event.external_message_id}"]`);
      if (!el) return;
      const infoDiv = el.querySelector('.msg-info');
      if (infoDiv && !infoDiv.querySelector('.msg-read-label')) {
        infoDiv.insertAdjacentHTML('beforeend', '<span class="msg-read-label">✓✓</span>');
      }
    }

    // ── Send message ─────────────────────────────────────────────

    function sendMessage() {
      const input = document.getElementById('compose-input');
      const text = input.value.trim();
      if (!text || !selectedChatId || !ws || ws.readyState !== 1) return;

      const mid = crypto.randomUUID();
      ws.send(JSON.stringify({
        action: 'send',
        chat_id: selectedChatId,
        mid: mid,
        text: text
      }));

      // Optimistic render
      appendMessage({
        id: mid,
        external_message_id: 'operator:' + mid,
        text: text,
        created_at: new Date().toISOString(),
        sender: { id: operatorId, type: 'operator', name: 'You' },
        status: 'new',
      });
      input.value = '';
    }

    document.getElementById('compose-send').addEventListener('click', sendMessage);
    document.getElementById('compose-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // ── Helpers ───────────────────────────────────────────────────

    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function truncate(str, len) {
      return str.length > len ? str.slice(0, len) + '...' : str;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ── Init ─────────────────────────────────────────────────────

    loadChats();
    connectWs();
  </script>
</body>
</html>
