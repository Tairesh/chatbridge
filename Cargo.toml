[package]
name = "chatbridge"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = { version = "11.0", features = ["rust_crypto"] }
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
redis = { version = "1.1", features = ["tokio-comp", "aio", "connection-manager"] }
# `query` and `form` are feature-gated in reqwest 0.13: the Instagram Graph calls pass
# their parameters as a query string, and the OAuth code exchange is form-encoded.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
    "query",
    "form",
] }
tracing = "0.1"
# `env-filter` gives RUST_LOG control over the level; without it `fmt::init()` is
# pinned to INFO and the debug-level webhook payload can never be turned on.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
urlencoding = "2"
