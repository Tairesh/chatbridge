services:
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      webhook: { condition: service_healthy }

  webhook:
    build:
      context: .
      dockerfile: docker/Dockerfile
    expose: ["3000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -so /dev/null http://localhost:3000/"]
      interval: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook
      POSTGRES_PASSWORD: webhook
      POSTGRES_DB: webhook
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhook"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

volumes:
  pgdata:
